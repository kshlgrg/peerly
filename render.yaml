services:
  - type: web
    name: peerly-api
    runtime: docker
    dockerfilePath: backend-rust/Dockerfile
    dockerContext: backend-rust
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PEERLY_CORS_ORIGINS
        sync: false
      - key: PEERLY_WS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  - type: web
    name: peerly-web
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_WS_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
